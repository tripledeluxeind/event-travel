<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seattle Travel Conditions and Events</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1><button type="button" id="city-toggle" class="city-toggle wavy-text">Seattle</button></h1>
      <div class="subtitle">Travel Conditions and Events</div>
      <span class="tagline">Weather &middot; Events</span>
    </div>
    <div class="clock-wrap">
      <div class="datetime-wrap">
        <div class="date" id="date">Loading…</div>
        <div class="clock" id="clock">--:--:--</div>
      </div>
      <div class="teaser-wrap">
        <div class="now-playing" id="now-playing"></div>
        <div class="next-event" id="next-event"></div>
      </div>
    </div>
  </header>

  <div id="alert-banner" class="alert-banner hidden"></div>

  <section class="card ticket-card" id="card-tickets">
    <div class="card-head">
      <h2><button type="button" class="card-collapse-toggle wavy-text" id="tickets-collapse-toggle"><span class="collapse-icon">▾</span> <span id="tickets-label"></span></button></h2>
    </div>
    <div class="card-body" id="tickets-body"></div>
  </section>

  <main class="grid">

    <section class="card" id="card-weather">
      <div class="card-head">
        <h2><button type="button" class="card-collapse-toggle wavy-text" id="weather-collapse-toggle"><span class="collapse-icon">▾</span> <span id="weather-label"></span></button></h2>
        <span class="updated" id="weather-updated">loading…</span>
      </div>
      <div class="card-body" id="weather-body">
        <div class="skeleton"></div>
      </div>
    </section>

    <section class="card" id="card-events">
      <div class="card-head">
        <h2><button type="button" class="card-collapse-toggle wavy-text" id="events-collapse-toggle"><span class="collapse-icon">▾</span> <span id="events-title"></span></button></h2>
        <div class="events-head-controls">
          <button type="button" id="events-date-clear" class="date-clear-btn hidden" title="Back to upcoming events">✕</button>
          <label class="date-input-label" for="events-date" aria-hidden="true">📅</label>
          <input type="date" id="events-date" class="date-input" aria-label="Jump to a specific date" title="Jump to a specific date">
          <span class="updated" id="events-updated">loading…</span>
        </div>
      </div>
      <div class="events-tabs" id="events-tabs">
        <button type="button" class="events-tab active" data-cat="all">All</button>
        <button type="button" class="events-tab" data-cat="concerts">Live Music</button>
        <button type="button" class="events-tab" data-cat="comedy">Comedy</button>
        <button type="button" class="events-tab" data-cat="community">Community</button>
        <button type="button" class="events-tab" data-cat="sports">Sports</button>
        <button type="button" class="events-tab" data-cat="food">Food</button>
      </div>
      <div class="card-body" id="events-body">
        <div class="skeleton"></div>
      </div>
    </section>

  </main>

  <footer class="footer">
    Sources: <a href="https://www.weather.gov/" target="_blank" rel="noopener">National Weather Service</a> ·
    <a id="events-source-link" href="https://do206.com/events" target="_blank" rel="noopener">Events Calendar</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
